name: Portfolio CI

on:
  pull_request:
  push:
    branches:
      - master
      - refresh-public-profile-2026

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"
      - run: npm audit --omit=dev --audit-level=high
